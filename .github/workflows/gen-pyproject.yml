name: Generate addon pyproject.toml

# Ensure each installable addon has a whool pyproject.toml (required for PyPI).
# Mirrors the local pre-commit hook `whool-init`.
on:
  push:
    branches:
      - "17.0"
    paths:
      - "**/__manifest__.py"
      - "**/pyproject.toml"
  pull_request:
    branches:
      - "17.0*"
    paths:
      - "**/__manifest__.py"
      - "**/pyproject.toml"
  workflow_dispatch:

jobs:
  gen-pyproject:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install whool
        run: pip install whool
      - name: Generate missing pyproject.toml files
        run: whool init
      - name: Check generated pyproject.toml on pull requests
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain '*/pyproject.toml')" ]; then
            echo "pyproject.toml is missing or out of date. Commit the generated files:"
            git status --porcelain '*/pyproject.toml'
            git --no-pager diff -- '*/pyproject.toml'
            exit 1
          fi
      - name: Commit and push generated pyproject.toml
        if: github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[BOT] Generate addon pyproject.toml with whool"
          file_pattern: "*/pyproject.toml"
